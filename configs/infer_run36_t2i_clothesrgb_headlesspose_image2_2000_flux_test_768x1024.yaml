project:
  name: sdxl_controlnet_inpaint_project
  output_dir: ./outputs/run36_t2i_4gpu_dualcontrol_clothesrgb_headlesspose_image2_2000_flux_768x1024_50ep_keep2
  seed: 42

data:
  all_metadata_path: ./datasets/image2_2000_flux_clothesrgb_headlesspose_t2i_dualcontrol_768x1024/metadata_all.jsonl
  train_metadata_path: ./datasets/image2_2000_flux_clothesrgb_headlesspose_t2i_dualcontrol_768x1024/metadata_train.jsonl
  val_metadata_path: ./datasets/image2_2000_flux_clothesrgb_headlesspose_t2i_dualcontrol_768x1024/metadata_test.jsonl
  image_size: 768
  image_width: 768
  image_height: 1024
  center_crop: false
  random_flip: false
  prompt_dropout: 0.0
  invert_mask: true
  conditioning_resize_modes:
    - bilinear
    - nearest

model:
  base_mode: t2i
  pretrained_model_name_or_path: stabilityai/stable-diffusion-xl-base-1.0
  controlnet_model_name_or_path: null
  controlnet_model_name_or_paths:
    - ./outputs/run36_t2i_4gpu_dualcontrol_clothesrgb_headlesspose_image2_2000_flux_768x1024_50ep_keep2/checkpoints/final/controlnet_0
    - ./outputs/run36_t2i_4gpu_dualcontrol_clothesrgb_headlesspose_image2_2000_flux_768x1024_50ep_keep2/checkpoints/final/controlnet_1
  num_controlnets: 2
  vae_model_name_or_path: null
  revision: null
  variant: fp16
  conditioning_type: dual_control
  prediction_type: epsilon
  attention_slicing: false

training:
  train_batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  num_epochs: 1
  max_train_steps: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  weight_decay: 1.0e-2
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_steps: 0
  mixed_precision: "bf16"
  gradient_checkpointing: false
  resume_from_checkpoint: null
  save_every_steps: 1
  validate_every_steps: 0
  controlnet_conditioning_scale:
    - 1.0
    - 0.9
  keep_region_loss_weight: 2.0

validation:
  num_inference_steps: 30
  guidance_scale: 5.0
  max_val_samples: 4

inference:
  metadata_path: ./datasets/image2_2000_flux_clothesrgb_headlesspose_t2i_dualcontrol_768x1024/metadata_test.jsonl
  checkpoint_dir: ./outputs/run36_t2i_4gpu_dualcontrol_clothesrgb_headlesspose_image2_2000_flux_768x1024_50ep_keep2/checkpoints/final
  output_dir: ./outputs/run36_t2i_4gpu_dualcontrol_clothesrgb_headlesspose_image2_2000_flux_768x1024_50ep_keep2/infer_test200
  prompt: null
  source_image: null
  mask_image: null
  conditioning_image: null
  output_path: ./outputs/infer/sample.png
  negative_prompt: "low quality, blurry, distorted, deformed body, broken clothes, extra limbs, skeleton-like hands, bony hands, rough pose lines"
  num_inference_steps: 30
  guidance_scale: 5.0
  controlnet_conditioning_scale:
    - 1.0
    - 0.9
  strength: 0.85
  invert_mask: true
  enable_model_cpu_offload: true
  generate_pairs: true
  pair_output_dir: ./outputs/run36_t2i_4gpu_dualcontrol_clothesrgb_headlesspose_image2_2000_flux_768x1024_50ep_keep2/original_generated_pairs
