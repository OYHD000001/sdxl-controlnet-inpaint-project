project:
  name: sdxl_controlnet_inpaint_project
  output_dir: ./outputs/run20_4gpu_cached_fast_dualcontrol_pretrained_canny_headlesspose_whiteplastic800_50ep
  seed: 42

data:
  all_metadata_path: ./datasets/whiteplastic800_sourceeqtarget_clothescanny_headlesspose_dualcontrol/metadata_all.jsonl
  train_metadata_path: ./datasets/whiteplastic800_sourceeqtarget_clothescanny_headlesspose_dualcontrol/metadata_train_latent_cached.jsonl
  val_metadata_path: ./datasets/whiteplastic800_sourceeqtarget_clothescanny_headlesspose_dualcontrol/metadata_val.jsonl
  image_size: 384
  image_width: 384
  image_height: 512
  center_crop: false
  random_flip: false
  mask_dilate: 0
  prompt_dropout: 0.0
  invert_mask: true
  conditioning_resize_modes:
    - nearest
    - nearest

model:
  pretrained_model_name_or_path: /home/ouyanghaodong/.cache/huggingface/hub/models--diffusers--stable-diffusion-xl-1.0-inpainting-0.1/snapshots/115134f363124c53c7d878647567d04daf26e41e
  controlnet_model_name_or_path: null
  controlnet_model_name_or_paths:
    - ./models/controlnet-canny-sdxl-1.0
    - ./models/controlnet-openpose-sdxl-1.0-xinsir
  num_controlnets: 2
  vae_model_name_or_path: null
  revision: null
  variant: fp16
  conditioning_type: dual_control
  prediction_type: epsilon
  attention_slicing: false

training:
  train_batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  num_epochs: 50
  max_train_steps: 9500
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  weight_decay: 1.0e-2
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_steps: 0
  mixed_precision: "bf16"
  gradient_checkpointing: true
  resume_from_checkpoint: latest
  save_every_steps: 950
  validate_every_steps: 0
  controlnet_conditioning_scale:
    - 1.0
    - 0.9
  keep_region_loss_weight: 2.0
  trainable_module_patterns:
    - "controlnet_cond_embedding"
    - "controlnet_down_blocks"
    - "controlnet_mid_block"

validation:
  num_inference_steps: 30
  guidance_scale: 5.0
  max_val_samples: 4

inference:
  metadata_path: ./datasets/whiteplastic800_sourceeqtarget_clothescanny_headlesspose_dualcontrol/metadata_val.jsonl
  checkpoint_dir: ./outputs/run20_4gpu_cached_fast_dualcontrol_pretrained_canny_headlesspose_whiteplastic800_50ep/checkpoints/final
  output_dir: ./outputs/run20_4gpu_cached_fast_dualcontrol_pretrained_canny_headlesspose_whiteplastic800_50ep/infer_test20
  prompt: null
  source_image: null
  mask_image: null
  conditioning_image: null
  output_path: ./outputs/infer/sample.png
  negative_prompt: "low quality, blurry, distorted, deformed body, broken clothes, extra limbs, skeleton-like hands, bony hands, rough pose lines"
  num_inference_steps: 30
  guidance_scale: 5.0
  controlnet_conditioning_scale:
    - 1.0
    - 0.9
  strength: 0.85
  invert_mask: true
  enable_model_cpu_offload: true

preview:
  metadata_path: ./datasets/whiteplastic800_sourceeqtarget_clothescanny_headlesspose_dualcontrol/metadata_train_preview4.jsonl
  output_dir: ./outputs/run20_4gpu_cached_fast_dualcontrol_pretrained_canny_headlesspose_whiteplastic800_50ep/train_previews
  every_steps: 950
  max_wait_seconds: 604800
