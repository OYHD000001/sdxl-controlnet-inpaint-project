project:
  name: canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024_50ep
  output_dir: ./outputs/run42_canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024_50ep
  seed: 42
  canonical_pose_inpaint: true
  fixed_prompt: "replace the human model with a smooth glossy white plastic retail mannequin, clearly non-human mannequin body, rigid mannequin limbs, no human skin, no flesh, no realistic face, no realistic hands, keep the exact clothes, garment texture, garment silhouette, pose, composition, and studio background"

data:
  all_metadata_path: ./datasets/canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024/metadata_all.jsonl
  train_metadata_path: ./datasets/canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024/metadata_train_latent_cached_768x1024.jsonl
  val_metadata_path: ./datasets/canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024/metadata_val.jsonl
  image_size: 768
  image_width: 768
  image_height: 1024
  center_crop: false
  random_flip: false
  prompt_dropout: 0.0
  invert_mask: true
  source_background_value: 0
  conditioning_resize_modes:
    - nearest
  condition_augmentation:
    enabled: true
    max_translate_px: 8
    max_rotate_deg: 2.0
    min_scale: 0.98
    max_scale: 1.02
    color_jitter_strength: 0.08
    mask_morphology_px: 1
    pose_max_translate_px: 4
    pose_max_rotate_deg: 2.0

model:
  base_mode: inpaint
  pretrained_model_name_or_path: /home/ouyanghaodong/.cache/huggingface/hub/models--diffusers--stable-diffusion-xl-1.0-inpainting-0.1/snapshots/115134f363124c53c7d878647567d04daf26e41e
  controlnet_model_name_or_path: ./models/controlnet-openpose-sdxl-1.0-xinsir
  controlnet_model_name_or_paths: null
  num_controlnets: 1
  vae_model_name_or_path: null
  revision: null
  variant: fp16
  prediction_type: epsilon
  attention_slicing: false
  controlnet_train_dtype: bf16
  dynamic_vae_encode_on_gpu: true

training:
  train_batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  num_epochs: 50
  max_train_steps: 30000
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-06
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_steps: 0
  mixed_precision: bf16
  gradient_checkpointing: true
  resume_from_checkpoint: null
  save_every_steps: 6000
  validate_every_steps: 0
  controlnet_conditioning_scale:
    - 1.0
  keep_region_loss_weight: 1.0
  trainable_module_patterns:
    - controlnet_cond_embedding
    - controlnet_down_blocks
    - controlnet_mid_block

validation:
  num_inference_steps: 30
  guidance_scale: 5.0
  max_val_samples: 4

inference:
  metadata_path: ./datasets/canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024/metadata_val.jsonl
  checkpoint_dir: ./outputs/run42_canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024_50ep/checkpoints/final
  output_dir: ./outputs/run42_canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024_50ep/infer_val200
  prompt: null
  negative_prompt: "real person, human, human skin, realistic face, realistic hands, blurry, low quality"
  num_inference_steps: 30
  guidance_scale: 5.0
  controlnet_conditioning_scale:
    - 1.0
  strength: 1.0
  invert_mask: true
  enable_model_cpu_offload: true
  generate_pairs: true
  pair_output_dir: ./outputs/run42_canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024_50ep/original_generated_pairs
  run_after_train: false

preview:
  metadata_path: ./datasets/canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024/metadata_train_preview4.jsonl
  output_dir: ./outputs/run42_canonical_flux_sourceeqtarget_pose_inpaint_2000_768x1024_50ep/epoch_previews
  every_epochs: 1
